<!doctype html>
<!-- ============================================================= -->
<!-- DATAVAULT V0.62 — modularer Aufbau                            -->
<!--                                                               -->
<!-- Diese Datei ist nur noch die Hülle. Der gesamte Code liegt    -->
<!-- in js/ und wird als ES-Module geladen. Kein Build-Schritt,    -->
<!-- kein Babel, kein npm — der Browser lädt die Dateien direkt.   -->
<!--                                                               -->
<!-- Wo was liegt:                                                 -->
<!--   js/main.js            Einstiegspunkt                        -->
<!--   js/app.js             Komponente: Zustand, Logik, Ansicht   -->
<!--   js/wiki.js            Wiki-Abruf und Aufbereitung           -->
<!--   js/sigil.js           Erzeugung der Artikel-Sigillen        -->
<!--   js/version.js         Versionsnummer                        -->
<!--   js/data/*.js          Fraktionen, Kategorien, Zeitleiste …  -->
<!--   js/styles/*.js        CSS, nach Bereichen getrennt          -->
<!-- ============================================================= -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0700" />
    <title>Datavault</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" type="image/png" href="icon-192.png" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Datavault" />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Cinzel+Decorative:wght@400;700&family=Share+Tech+Mono&family=Source+Serif+4:ital,wght@0,300;0,400;0,600;1,300;1,400&display=swap" rel="stylesheet" />
    <style> html,body { margin:0; background:#0a0700; } </style>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  </head>
  <body>
    <div id="root"></div>

    <script>
      // Fängt Fehler ab, die beim Laden der Module auftreten, damit statt
      // eines schwarzen Bildschirms die Ursache auf dem Gerät sichtbar wird.
      (function () {
        function zeigen(text) {
          var root = document.getElementById("root");
          if (root && root.children.length === 0) {
            root.innerHTML =
              '<pre style="color:#ff5555;padding:20px;white-space:pre-wrap;' +
              'font-family:monospace">' + text + '</pre>';
          }
        }
        window.addEventListener("error", function (e) {
          zeigen("Fehler:\n" + (e.message || e));
        });
        window.addEventListener("unhandledrejection", function (e) {
          zeigen("Fehler beim Laden eines Moduls:\n" +
                 ((e.reason && e.reason.message) || e.reason));
        });
        // Läuft nach 8 Sekunden noch nichts, ist vermutlich ein Modul
        // nicht auffindbar — das meldet der Browser sonst nur in der Konsole.
        setTimeout(function () {
          zeigen("Die App wurde nicht geladen.\n\n" +
                 "Meist fehlt eine Datei unter js/ oder der Ordner wurde\n" +
                 "beim Hochladen nicht mit übertragen.");
        }, 8000);
      })();
    </script>

    <script type="module" src="js/main.js"></script>

    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", function () {
          navigator.serviceWorker.register("sw.js").catch(function () {});
        });
      }
    </script>
  </body>
</html>
